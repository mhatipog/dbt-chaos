name: Genuine contract-aware good-faith LLM trials

on:
  push:
    branches: [research/good-intentions-handoff-20261119]
    paths:
      - '.github/workflows/contract-agent-live.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: contract-agent-genuine-model-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real-llm-domains:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - family: qwen05
            seed: 20261119
            model_repo: Qwen/Qwen2.5-Coder-0.5B-Instruct-GGUF
            model_file: qwen2.5-coder-0.5b-instruct-q4_k_m.gguf
          - family: qwen15
            seed: 20261119
            model_repo: Qwen/Qwen2.5-Coder-1.5B-Instruct-GGUF
            model_file: qwen2.5-coder-1.5b-instruct-q4_k_m.gguf
          - family: qwen05
            seed: 20261120
            model_repo: Qwen/Qwen2.5-Coder-0.5B-Instruct-GGUF
            model_file: qwen2.5-coder-0.5b-instruct-q4_k_m.gguf
    runs-on: ubuntu-24.04
    timeout-minutes: 31
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install local CPU inference and process evaluator
        run: |
          python -m pip install --disable-pip-version-check -e . \
            'llama-cpp-python>=0.3,<0.4' 'huggingface_hub>=0.26,<2'
      - name: Download original open GGUF model, no paid API or credentials
        run: |
          python - <<'PY'
          from huggingface_hub import hf_hub_download
          p=hf_hub_download(
              repo_id='${{ matrix.model_repo }}',
              filename='${{ matrix.model_file }}',
              local_dir='/tmp/local-model')
          print('Local CPU weights:',p)
          PY
      - name: Real good-faith LLM decisions on two distinct business processes
        run: |
          mkdir -p /tmp/genuine-agent
          for domain in procurement grants; do
            python -m dbt_chaos.contract_agent \
              --agent llama --model '/tmp/local-model/${{ matrix.model_file }}' \
              --contract "contracts/${domain}.json" \
              --seed "${{ matrix.seed }}" --steps 6 \
              --public-dir "/tmp/genuine-agent/${domain}-public" \
              --private-dir "/tmp/genuine-agent/${domain}-private" \
              > "/tmp/genuine-agent/${domain}-summary.json"
          done
      - name: Verify genuine model SHA, all source snapshots and paired policy scores
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('/tmp/genuine-agent')
          summaries=[]
          for name in ('procurement','grants'):
              pub=root/(name+'-public')
              pri=root/(name+'-private')
              manifest=json.loads((pub/'manifest.json').read_text())
              report=json.loads((pri/'assessment.json').read_text())
              summary=json.loads((root/(name+'-summary.json')).read_text())
              assert summary['steps']==6
              assert summary['worker']=='genuine_qwen_gguf_good_faith'
              assert len(summary['model_sha256'])==64
              assert report['methodology']['genuine_weak_llm']
              assert report['methodology']['one_ticket_independent_counterfactuals']
              assert report['methodology']['process_ledger_hidden_from_worker']
              assert len(report['decisions'])==6
              assert all(x['quality_checks_run_on_actual_sqlite'] for x in report['decisions'])
              for filename,digest in manifest['file_sha256'].items():
                  assert hashlib.sha256((pub/filename).read_bytes()).hexdigest()==digest
              assert not (pub/'business_gold.json').exists()
              assert not (pub/'assessment.json').exists()
              assert (pri/'original_process_events.jsonl').exists()
              assert (pri/'business_gold.json').exists()
              for step in report['decisions']:
                  assert set(step['policies'])=={
                      'raw','monitor','block_on_detection','evidence_gate','attested_gate'}
                  assert step['policies']['evidence_gate']['publication'][
                      'false_published_l1_cents']==0,step
                  assert step['policies']['attested_gate']['publication'][
                      'false_published_l1_cents']==0,step
                  if step['source_l1_cents']>0:
                      assert step['guard_decisions']['evidence_gate'][
                          'decision']=='review_required',step
                  assert step['policies']['raw']['publication'][
                      'fraction_of_correct_business_value_published']<=1
              summaries.append(summary)
              print(name,'valid',summary['valid_proposals'],
                    'actual source changes',summary['actual_source_changes'],
                    'business errors',summary['material_business_errors'],
                    'raw error cases',summary['policy_results']['raw'][
                        'cases_with_wrong_publication'])
          assert summaries[0]['model_sha256']==summaries[1]['model_sha256']
          (root/'combined-summary.json').write_text(json.dumps({
              'family':'${{ matrix.family }}','seed':${{ matrix.seed }},
              'domains':summaries,
          },indent=2))
          print('VALID: 12 actual model decisions; any zero-error result remains a negative finding')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: contract-agent-real-${{ matrix.family }}-seed-${{ matrix.seed }}-public
          path: |
            /tmp/genuine-agent/procurement-public/
            /tmp/genuine-agent/grants-public/
          retention-days: 2
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: contract-agent-real-${{ matrix.family }}-seed-${{ matrix.seed }}-assessment
          path: |
            /tmp/genuine-agent/procurement-private/
            /tmp/genuine-agent/grants-private/
            /tmp/genuine-agent/combined-summary.json
          retention-days: 2
          if-no-files-found: warn
