name: Frozen genuine 3B decisions with scoped signed provider receipt

on:
  push:
    branches: [research/good-intentions-handoff-20261119]
    paths:
      - 'dbt_chaos/contract_receipt.py'
      - 'dbt_chaos/contract_review.py'
      - '.github/workflows/replay-frozen-3b-receipt.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  replay-actual-llm-with-scoped-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -e .
      - name: Obtain frozen actual Qwen 3B responses, without running a new model
        uses: actions/download-artifact@v4
        with:
          name: balanced-qwen3b-private-evaluation
          run-id: '44684565265'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/frozen-qwen3b
      - name: Replay every archived model review under signed-provider gate
        run: |
          python - <<'PY'
          from pathlib import Path
          from dbt_chaos.contract_review import (
              make_review_cases, review_case, summarize)
          import json
          path=Path('/tmp/frozen-qwen3b')
          output=Path('/tmp/scoped-3b')
          output.mkdir(exist_ok=True)
          for domain in ('procurement','grants'):
              c=json.loads(Path('contracts',domain+'.json').read_text())
              old=json.loads((path/(domain+'-private')/'assessment.json').read_text())
              assert old['model']=='real_local_qwen_maintenance_reviewer'
              assert len(old['model_sha256'])==64
              assert old['seed']==20261119
              events, cases=make_review_cases(c,20261119)
              by_id={case['id']:case for case in cases}
              replay=[]
              for previous in old['cases']:
                  actual=review_case(c,events,by_id[previous['case_id']],
                                     previous['raw_model_response'])
                  # Assert this is EXACTLY the original model decision and
                  # originally scored output; do not modify the agent choice.
                  assert actual['model_decision']==previous['model_decision']
                  assert actual['model_json_valid']==previous['model_json_valid']
                  assert actual['candidate_outcome_class']==previous['candidate_outcome_class']
                  for key in ('always_keep_publication',
                              'always_apply_publication',
                              'selected_ungated_publication'):
                      assert actual[key]==previous[key],(domain,key)
                  for name in ('source_only','attested'):
                      assert actual['selected_gate_results'][name]==previous[
                          'selected_gate_results'][name],(domain,name)
                  new=actual['selected_gate_results']['provider_receipt']
                  assert not new['full_process_ledger_given_to_gate']
                  assert not new['model_authored_receipt']
                  assert not new['production_provider_connected']
                  replay.append(actual)
              derived=dict(old)
              derived['cases']=replay
              summary=summarize(derived)
              assert len(replay)==6
              assert summary['approved_candidates']==2,summary
              assert summary['policy_results']['selected_ungated_publication'][
                  'wrong_case_count']==0,summary
              # Source-only gate cannot fix a pre-existing financial error,
              # despite the model's correct approval.
              assert summary['policy_results']['selected_source_only_gate'][
                  'wrong_case_count']==1,summary
              assert summary['policy_results']['selected_provider_receipt_gate'][
                  'wrong_case_count']==0,summary
              recovered=next(x for x in replay if x['case_id']=='attested_credit_recovery')
              assert recovered['model_decision']['decision']=='apply'
              assert recovered['selected_gate_results']['provider_receipt'][
                  'gate_decision']['reason']=='authentic_scoped_provider_receipt'
              duplicate=next(x for x in replay if x['case_id']=='exact_duplicate_cleanup')
              assert duplicate['model_decision']['decision']=='apply'
              assert duplicate['selected_gate_results']['provider_receipt'][
                  'gate_decision']['reason']=='exact_duplicate_cleanup'
              assert all(x['model_decision']['decision']!='apply' for x in replay[:3])
              (output/(domain+'-replay.json')).write_text(
                  json.dumps({'original_model_run':44684565265,
                              'frozen_actual_model_decisions':True,
                              'contract':domain,'source_model_sha256':old['model_sha256'],
                              'summary':summary,'decisions':replay},indent=2,sort_keys=True))
              print(domain,'real frozen 3B approvals:',summary['approved_candidates'],
                    'source-only wrong cases:',
                    summary['policy_results']['selected_source_only_gate']['wrong_case_count'],
                    'scoped receipt wrong cases:',
                    summary['policy_results']['selected_provider_receipt_gate']['wrong_case_count'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: genuine-qwen3b-scoped-receipt-replay
          path: /tmp/scoped-3b/
          retention-days: 2
          if-no-files-found: warn
