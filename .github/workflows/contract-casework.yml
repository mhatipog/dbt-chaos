name: Actual publication lifecycle of a disputed financial correction

on:
  push:
    branches: [research/good-intentions-handoff-20261119]
    paths:
      - 'dbt_chaos/contract_casework.py'
      - 'tests/test_contract_casework.py'
      - '.github/workflows/contract-casework.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dbt-chaos-casework-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-dispute-targeted-hold-provider-receipt-recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -e .
      - name: Run real SQLite publication and scope-isolation tests
        run: |
          python -m compileall -q dbt_chaos
          python -m unittest discover -s tests -p test_contract_casework.py -v
          python -m unittest discover -s tests -p test_contract_receipt.py -v
      - name: Emit complete three-stage business truth and source publication reports
        run: |
          mkdir -p /tmp/casework
          python - <<'PY'
          from pathlib import Path
          import json
          from dbt_chaos.contract_review import make_review_cases
          from dbt_chaos.contract_casework import demonstrate_contract_casework
          for name in ('procurement','grants'):
              contract=json.loads((Path('contracts')/(name+'.json')).read_text())
              events,cases=make_review_cases(contract,20261119)
              report=demonstrate_contract_casework(contract,events,cases[4])
              a,b,c=report['stages']
              assert a['score']['status']=='silently_wrong'
              assert b['score']['status']=='partially_held'
              assert b['score']['false_published_l1_cents']==0
              assert len(b['held_group_ids'])==1
              assert c['score']['status']=='correctly_published'
              assert c['score']['fraction_of_correct_business_value_published']==1
              assert c['gate']['reason']=='authentic_scoped_provider_receipt'
              assert not report['source_ledger_present_in_release_planner']
              assert not report['signing_key_exported']
              (Path('/tmp/casework')/(name+'.json')).write_text(
                  json.dumps(report,indent=2,sort_keys=True))
              print(name,'unprotected',a['score']['false_published_l1_cents'],
                    'cents; held 1 reporting group; verified then published correct')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: two-domain-financial-dispute-casework
          path: /tmp/casework/
          retention-days: 2
          if-no-files-found: warn
