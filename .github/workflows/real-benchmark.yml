name: Bounded actual dbt research campaign
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dbt-chaos-campaign
  cancel-in-progress: false
jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -e '.[dbt]'
      - run: python -m dbt_chaos bench-dbt --seed 20261117 --count 3 --strategies strict,offset,full --max-executions 9 --time-budget 900 --out /tmp/real-evidence.json
      - name: Show bounded evidence
        run: python -c "import json; x=json.load(open('/tmp/real-evidence.json')); print(json.dumps({'evidence_level':x['evidence_level'],'strategies':x['strategies']}, indent=2))"
