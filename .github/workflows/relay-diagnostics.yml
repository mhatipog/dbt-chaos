name: Relay diagnostic provenance and first-divergence controls

on:
  push:
    branches: [research/good-intentions-handoff-20261119]
    paths:
      - 'dbt_chaos/relay_diagnostics.py'
      - 'tests/test_relay_diagnostics.py'
      - '.github/workflows/relay-diagnostics.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  independent-relay-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -e .
      - name: Validate notes, action-alignment proxies and first matched divergence
        run: python -m unittest discover -s tests -p test_relay_diagnostics.py -v
