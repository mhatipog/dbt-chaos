name: Verified dbt baseline
on:
  push:
    branches: [main]
    paths:
      - 'benchmarks/legacy/**'
      - '.github/workflows/legacy.yml'
  workflow_dispatch:
concurrency:
  group: dbt-chaos-legacy
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  actual-dbt:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: benchmarks/legacy
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - run: python -m unittest -v
      - run: python run.py --output /tmp/dbt-chaos-legacy.json
