name: Framework and benchmark checks
on:
  push:
    branches: [main]
    paths:
      - 'dbt_chaos/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/framework.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.10', '3.12']
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --disable-pip-version-check -e .
      - run: python -m unittest discover -s tests -v
      - run: python -m dbt_chaos bench --seed 20261117 --count 150 --out /tmp/scores.json
      - run: python -m dbt_chaos generate --seed 17 --count 2 --out /tmp/chaos-plans
      - run: python -m dbt_chaos minimize /tmp/chaos-plans/0001.json --out /tmp/minimized.json
