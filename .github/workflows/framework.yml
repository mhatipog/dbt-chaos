name: Framework and benchmark checks
on:
  push:
    branches: [main]
    paths:
      - 'dbt_chaos/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/framework.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.10', '3.12']
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --disable-pip-version-check -e .
      - run: python -m unittest discover -s tests -v
      - name: Verify distributable wheel contains dbt SQL fixtures
        run: |
          python -m pip wheel --no-deps --disable-pip-version-check -w /tmp/dbt-chaos-wheels .
          python -c "import glob,zipfile; p=glob.glob('/tmp/dbt-chaos-wheels/dbt_chaos-*.whl')[0]; names=set(zipfile.ZipFile(p).namelist()); required={'dbt_chaos/sql/dbt_project.yml','dbt_chaos/sql/profiles.yml','dbt_chaos/sql/models/orders.sql','dbt_chaos/sql/tests/live_amount_nonnegative.sql','dbt_chaos/commerce_sql/dbt_project.yml','dbt_chaos/commerce_sql/models/gold_daily_revenue.sql','dbt_chaos/commerce_sql/tests/source_invalid_payments.sql'}; assert required<=names,(required-names); print('Wheel includes real dbt fixtures')"
      - run: python -m dbt_chaos bench --seed 20261117 --count 150 --out /tmp/scores.json
      - run: python -m dbt_chaos report /tmp/scores.json --out /tmp/resilience.html
      - run: python -c "from pathlib import Path; t=Path('/tmp/resilience.html').read_text(); assert '<table>' in t and 'python_model_screen' in t"
      - run: python -m dbt_chaos generate --seed 17 --count 2 --out /tmp/chaos-plans
      - run: python -m dbt_chaos minimize /tmp/chaos-plans/0001.json --out /tmp/minimized.json
