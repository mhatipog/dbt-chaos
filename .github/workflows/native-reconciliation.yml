name: "Native dbt multi-source transaction and bank reconciliation"

on:
  push:
    branches: [research/good-intentions-handoff-20261119]
    paths:
      - 'dbt_chaos/commerce_sql/models/reconciliation/**'
      - 'dbt_chaos/commerce_sql/models/schema.yml'
      - 'dbt_chaos/commerce_runner.py'
      - 'dbt_chaos/reconciliation.py'
      - 'tests/test_native_reconciliation.py'
      - 'pyproject.toml'
      - '.github/workflows/native-reconciliation.yml'
  pull_request:
    paths:
      - 'dbt_chaos/commerce_sql/models/reconciliation/**'
      - 'dbt_chaos/commerce_sql/models/schema.yml'
      - 'dbt_chaos/commerce_runner.py'
      - 'dbt_chaos/reconciliation.py'
      - 'tests/test_native_reconciliation.py'
      - 'pyproject.toml'
      - '.github/workflows/native-reconciliation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-evidence-reconciliation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real-duckdb-reconciliation:
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -e '.[dbt]'
      - name: Validate reference evidence independence and lags
        run: python -m unittest discover -s tests -p test_reconciliation.py -v
      - name: Execute real dbt against all matched payment+GL+bank scenarios
        run: python -m unittest discover -s tests -p test_native_reconciliation.py -v
      - name: Run existing commerce regression to ensure native models are opt-in
        run: python -m unittest discover -s tests -p test_commerce.py -v
      - name: Check packaged native SQL exists in the release wheel
        run: |
          python -m pip wheel --disable-pip-version-check --no-deps . -w /tmp/reconciliation-wheels
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          wheel=list(Path('/tmp/reconciliation-wheels').glob('dbt_chaos-*.whl'))
          assert len(wheel)==1,wheel
          with ZipFile(wheel[0]) as archive:
              names=set(archive.namelist())
              expected=(
                  'rec_payment_evidence.sql','rec_bank_evidence.sql',
                  'rec_held_groups.sql','rec_release_gate.sql',
                  'rec_gold_published.sql',
              )
              for name in expected:
                  path='dbt_chaos/commerce_sql/models/reconciliation/'+name
                  assert path in names,path
          print('Verified five executable native SQL models are distributed.')
          PY
