name: Commerce representative real dbt matrix
on:
  push:
    branches: [research/source-sql-chaos, main]
    paths:
      - '.github/workflows/commerce-matrix.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  measured:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -e '.[dbt]'
      - name: Execute 29 cases against real dbt/DuckDB and classify outcomes
        run: python -m dbt_chaos commerce-bench --selection representative --max-cases 30 --out /tmp/commerce-matrix.json
      - name: Print honest outcome summary, explicitly failing on execution errors
        run: |
          python - <<'PY'
          import json
          report=json.load(open('/tmp/commerce-matrix.json'))
          print('Evidence:',report['evidence_level'])
          print('Cases:',report['cases'])
          print('Outcomes:',json.dumps(report['outcomes'],sort_keys=True))
          print('By origin:',json.dumps(report['per_origin'],sort_keys=True))
          print('Interactions:',json.dumps(report['interactions'],sort_keys=True))
          assert len(report['interactions'])==7
          assert report['cases']==29
          assert report['execution_errors']==0
          assert report['outcomes'].get('silent_corruption',0)>0
          assert report['outcomes'].get('contained',0)>0
          for row in report['results']:
              print(row['case'],row['classification'],
                    'gold-diff-keys',len(row['contract_difference']))
          PY
