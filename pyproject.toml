[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "dbt-chaos"
version = "0.2.0"
description = "Data chaos generation, reproducible execution and resilience scoring"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{name = "Vecture"}]
dependencies = []

[project.optional-dependencies]
dbt = ["dbt-core==1.10.15", "dbt-duckdb==1.10.1", "duckdb==1.4.4"]

[project.scripts]
dbt-chaos = "dbt_chaos.cli:main"

[tool.setuptools.packages.find]
include = ["dbt_chaos*"]

[tool.setuptools.package-data]
"dbt_chaos" = ["sql/*.yml", "sql/models/*.sql", "sql/models/*.yml", "sql/tests/*.sql", "commerce_sql/*.yml", "commerce_sql/models/*.sql", "commerce_sql/models/*.yml", "commerce_sql/tests/*.sql"]
